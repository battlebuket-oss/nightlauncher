name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package (win-x64)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Show SDK
        run: dotnet --info

      - name: Build application and smoke tests
        run: dotnet build tests/NightLauncher.SmokeTests/NightLauncher.SmokeTests.csproj --configuration Release

      - name: Run smoke tests
        run: dotnet run --project tests/NightLauncher.SmokeTests/NightLauncher.SmokeTests.csproj --configuration Release --no-build

      - name: Test release signing policy
        shell: pwsh
        run: ./tests/PowerShell/Validate-ReleasePolicy.Tests.ps1

      - name: Check NuGet packages for known vulnerabilities
        shell: pwsh
        run: |
          dotnet list src/NightLauncher/NightLauncher.csproj package --vulnerable --include-transitive
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet vulnerability check failed."
          }

      - name: Publish self-contained executable
        run: >-
          dotnet publish src/NightLauncher/NightLauncher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $programFiles = [Environment]::GetFolderPath("ProgramFiles")
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $compilerPaths = @(
            (Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"),
            (Join-Path $programFiles "Inno Setup 6\ISCC.exe"),
            (Join-Path $programFilesX86 "Inno Setup 7\ISCC.exe"),
            (Join-Path $programFiles "Inno Setup 7\ISCC.exe")
          )
          $existingCompiler = $compilerPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $existingCompiler) {
            winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup installation failed."
            }
          }

      - name: Build installer, optionally sign, and package
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $programFiles = [Environment]::GetFolderPath("ProgramFiles")
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $compilerPaths = @(
            (Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"),
            (Join-Path $programFiles "Inno Setup 6\ISCC.exe"),
            (Join-Path $programFilesX86 "Inno Setup 7\ISCC.exe"),
            (Join-Path $programFiles "Inno Setup 7\ISCC.exe")
          )
          $iscc = $compilerPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }

          [xml]$project = Get-Content "src/NightLauncher/NightLauncher.csproj"
          $appVersion = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($appVersion)) {
            throw "Could not read the application version from NightLauncher.csproj."
          }
          Add-Content -Path $env:GITHUB_ENV -Value "NIGHTLAUNCHER_VERSION=$appVersion"

          if ($env:GITHUB_REF -like "refs/tags/*" -and $env:GITHUB_REF_NAME -ne "v$appVersion") {
            throw "Release tag '$env:GITHUB_REF_NAME' must match the application version tag 'v$appVersion'."
          }

          $sourceDir = (Resolve-Path "artifacts/publish").Path
          & $iscc "/DMyAppVersion=$appVersion" "/DSourceDir=$sourceDir" "installer/NightLauncher.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed."
          }

          $installer = "artifacts/NightLauncher-Setup-$appVersion.exe"
          $application = "artifacts/publish/NightLauncher.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer output was not created."
          }

          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          & "scripts/Validate-ReleasePolicy.ps1" -Reference $env:GITHUB_REF -ReferenceName $env:GITHUB_REF_NAME -AppVersion $appVersion -HasCertificate $hasCertificate -HasPassword $hasPassword

          if ($hasCertificate) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "nightlauncher-signing.pfx"
            try {
              [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
              $kitsPath = Join-Path $programFilesX86 "Windows Kits\10\bin"
              $signtool = Get-ChildItem -Path $kitsPath -Filter "signtool.exe" -File -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if (-not $signtool) {
                throw "Windows SDK signtool.exe was not found."
              }

              foreach ($target in @($application, $installer)) {
                & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "https://timestamp.digicert.com" /f $pfxPath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD $target
                if ($LASTEXITCODE -ne 0) {
                  throw "Authenticode signing failed for $target."
                }
                & $signtool.FullName verify /pa /all $target
                if ($LASTEXITCODE -ne 0) {
                  throw "Authenticode verification failed for $target."
                }
              }
              "Authenticode signatures verified for executable and installer."
            }
            finally {
              if (Test-Path $pfxPath) {
                Remove-Item $pfxPath -Force
              }
            }
          }
          else {
            Write-Warning "No signing certificate configured. The EXE and installer will be unsigned."
          }

          if ((Get-Item $application).Length -lt 1MB) {
            throw "Published executable is unexpectedly small."
          }
          if ((Get-Item $installer).Length -lt 1MB) {
            throw "Installer output is unexpectedly small."
          }

          Compress-Archive -Path "artifacts/publish/*" -DestinationPath "artifacts/NightLauncher-win-x64.zip" -Force
          Get-FileHash $application -Algorithm SHA256 | Format-List
          Get-FileHash $installer -Algorithm SHA256 | Format-List
          Get-FileHash "artifacts/NightLauncher-win-x64.zip" -Algorithm SHA256 | Format-List

      - name: Install and uninstall smoke test (preserve user data)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path "artifacts/NightLauncher-Setup-$env:NIGHTLAUNCHER_VERSION.exe").Path
          $installRoot = Join-Path $env:LOCALAPPDATA "Programs\NightLauncher"
          $appDataRoot = Join-Path $env:LOCALAPPDATA "NightLauncher"
          $backupRoot = Join-Path $env:RUNNER_TEMP "NightLauncher-lifecycle-backups"

          if (Test-Path $installRoot) {
            throw "The runner already has a NightLauncher installation at $installRoot."
          }

          New-Item -ItemType Directory -Force -Path $appDataRoot, $backupRoot | Out-Null
          $libraryMarker = Join-Path $appDataRoot "library.json"
          $settingsMarker = Join-Path $appDataRoot "settings.json"
          $backupMarker = Join-Path $backupRoot "NightLauncher-library-lifecycle-test.json"
          Set-Content -Path $libraryMarker -Value '[{"Name":"Installer lifecycle test"}]' -NoNewline
          @{ BackupDirectory = $backupRoot } | ConvertTo-Json | Set-Content -Path $settingsMarker -NoNewline
          Set-Content -Path $backupMarker -Value '{"Backup":"must survive uninstall"}' -NoNewline

          $install = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Per-user install failed with exit code $($install.ExitCode)."
          }

          $installedExe = Join-Path $installRoot "NightLauncher.exe"
          $uninstaller = Join-Path $installRoot "unins000.exe"
          $startMenuShortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\NightLauncher.lnk"
          if (-not (Test-Path $installedExe)) {
            throw "Installer did not place NightLauncher.exe under the per-user application directory."
          }
          if (-not (Test-Path $uninstaller)) {
            throw "Installer did not create its uninstaller."
          }
          if (-not (Test-Path $startMenuShortcut)) {
            throw "Installer did not create the expected Start Menu shortcut."
          }

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstall failed with exit code $($uninstall.ExitCode)."
          }

          if (Test-Path $installRoot) {
            throw "Uninstall left application files behind at $installRoot."
          }
          if (Test-Path $startMenuShortcut) {
            throw "Uninstall left the Start Menu shortcut behind."
          }
          foreach ($markerPath in @($libraryMarker, $settingsMarker, $backupMarker)) {
            if (-not (Test-Path $markerPath)) {
              throw "Uninstall unexpectedly removed user data: $markerPath"
            }
          }

          "Per-user install/uninstall passed; library, settings, and backup data were preserved."
          Get-FileHash $libraryMarker, $settingsMarker, $backupMarker -Algorithm SHA256 | Format-Table -AutoSize

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightlauncher-win-x64
          path: |
            artifacts/publish/NightLauncher.exe
            artifacts/NightLauncher-win-x64.zip
            artifacts/NightLauncher-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Windows release assets
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release metadata
        uses: actions/checkout@v7
        with:
          ref: \${{ github.sha }}

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nightlauncher-win-x64
          path: artifacts

      - name: Publish CI build as a prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: \${{ github.token }}
          RELEASE_TAG: ci-\${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/NightLauncher/NightLauncher.csproj | head -n 1)"
          INSTALLER="artifacts/NightLauncher-Setup-\${APP_VERSION}.exe"
          ASSETS=( "artifacts/publish/NightLauncher.exe" "artifacts/NightLauncher-win-x64.zip" "$INSTALLER" )
          for asset in "\${ASSETS[@]}"; do
            test -s "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done

          NOTES="Automated Windows build from main. Development prerelease. Authenticode signing is applied only when the repository signing-certificate secrets are configured."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "\${ASSETS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "\${ASSETS[@]}" \
              --title "NightLauncher CI build #\${{ github.run_number }}" \
              --notes "$NOTES" \
              --prerelease
          fi

      - name: Publish versioned GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: \${{ github.token }}
          RELEASE_TAG: \${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/NightLauncher/NightLauncher.csproj | head -n 1)"
          EXPECTED_TAG="v\${APP_VERSION}"
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Tag '$RELEASE_TAG' does not match application version '$EXPECTED_TAG'." >&2
            exit 1
          fi

          INSTALLER="artifacts/NightLauncher-Setup-\${APP_VERSION}.exe"
          ASSETS=( "artifacts/publish/NightLauncher.exe" "artifacts/NightLauncher-win-x64.zip" "$INSTALLER" )
          for asset in "\${ASSETS[@]}"; do
            test -s "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done

          NOTES="NightLauncher release. See the repository README and SECURITY.md for launch, backup, and trust details."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "\${ASSETS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "\${ASSETS[@]}" \
              --title "NightLauncher $RELEASE_TAG" \
              --notes "$NOTES"
          fi
