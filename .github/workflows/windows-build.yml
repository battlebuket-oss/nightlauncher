name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, smoke test and package (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show SDK
        run: dotnet --info

      - name: Build application and smoke tests
        run: dotnet build tests/NightLauncher.SmokeTests/NightLauncher.SmokeTests.csproj --configuration Release

      - name: Run smoke tests
        run: dotnet run --project tests/NightLauncher.SmokeTests/NightLauncher.SmokeTests.csproj --configuration Release --no-build

      - name: Publish self-contained executable
        run: >-
          dotnet publish src/NightLauncher/NightLauncher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Verify executable and create portable ZIP
        shell: pwsh
        run: |
          $exe = "artifacts/publish/NightLauncher.exe"
          if (-not (Test-Path $exe)) {
            throw "Publish did not produce NightLauncher.exe"
          }
          if ((Get-Item $exe).Length -lt 1MB) {
            throw "Published executable is unexpectedly small"
          }
          Compress-Archive -Path "artifacts/publish/*" -DestinationPath "artifacts/NightLauncher-win-x64.zip" -Force
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightlauncher-win-x64
          path: |
            artifacts/publish/NightLauncher.exe
            artifacts/NightLauncher-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish CI build as a prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ci-${{ github.run_number }}
        run: |
          gh release create $env:RELEASE_TAG "artifacts/publish/NightLauncher.exe" "artifacts/NightLauncher-win-x64.zip" --title "NightLauncher CI build #${{ github.run_number }}" --notes "Automated Windows build from main. This is an unsigned development prerelease." --prerelease

      - name: Publish versioned GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG "artifacts/publish/NightLauncher.exe" "artifacts/NightLauncher-win-x64.zip" --clobber
          } else {
            gh release create $env:RELEASE_TAG "artifacts/publish/NightLauncher.exe" "artifacts/NightLauncher-win-x64.zip" --title "NightLauncher $env:RELEASE_TAG" --generate-notes
          }
